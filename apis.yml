name: GigFinesse
description: 'GigFinesse is a live-entertainment talent booking platform that connects hospitality venues
  — hotels, restaurants, bars, and clubs — with musicians, DJs, and performing artists. Venues discover
  and book vetted talent and manage contracts, insurance, scheduling, and payments through a centralized
  dashboard, while artists gain access to consistent, recurring gig opportunities. Clients include premium
  hospitality brands such as St. Regis, The Ritz-Carlton, Fairmont Hotels, and Hard Rock Hotel. GigFinesse
  is backed by Bessemer Venture Partners. No public developer API is published as of this enrichment pass.'
